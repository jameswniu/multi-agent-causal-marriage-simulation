# Clippy settings for the LoveWorld engine, read by `cargo clippy` for every crate in this workspace.
#
# The float methods below call the platform's maths library, which rounds some results differently in the
# last bit on macOS and Linux, so a world would stop replaying bit for bit across platforms. Use the libm
# crate's function named in each reason instead. powi is refused too: LLVM leaves the order of its
# multiplications open, so write the product out. sqrt stays allowed, since IEEE 754 requires it to be
# correctly rounded everywhere.
disallowed-methods = [
  { path = "f64::exp", reason = "rounds differently by platform, so use libm::exp" },
  { path = "f64::exp2", reason = "rounds differently by platform, so use libm::exp2" },
  { path = "f64::exp_m1", reason = "rounds differently by platform, so use libm::expm1" },
  { path = "f64::ln", reason = "rounds differently by platform, so use libm::log" },
  { path = "f64::log", reason = "rounds differently by platform, so use libm::log(x) / libm::log(base)" },
  { path = "f64::log2", reason = "rounds differently by platform, so use libm::log2" },
  { path = "f64::log10", reason = "rounds differently by platform, so use libm::log10" },
  { path = "f64::ln_1p", reason = "rounds differently by platform, so use libm::log1p" },
  { path = "f64::powf", reason = "rounds differently by platform, so use libm::pow, or libm::exp2 for a power of 2" },
  { path = "f64::sin", reason = "rounds differently by platform, so use libm::sin" },
  { path = "f64::cos", reason = "rounds differently by platform, so use libm::cos" },
  { path = "f64::tan", reason = "rounds differently by platform, so use libm::tan" },
  { path = "f64::sin_cos", reason = "rounds differently by platform, so use libm::sincos" },
  { path = "f64::tanh", reason = "rounds differently by platform, so use libm::tanh" },
  { path = "f64::sinh", reason = "rounds differently by platform, so use libm::sinh" },
  { path = "f64::cosh", reason = "rounds differently by platform, so use libm::cosh" },
  { path = "f64::asin", reason = "rounds differently by platform, so use libm::asin" },
  { path = "f64::acos", reason = "rounds differently by platform, so use libm::acos" },
  { path = "f64::atan", reason = "rounds differently by platform, so use libm::atan" },
  { path = "f64::atan2", reason = "rounds differently by platform, so use libm::atan2" },
  { path = "f64::asinh", reason = "rounds differently by platform, so use libm::asinh" },
  { path = "f64::acosh", reason = "rounds differently by platform, so use libm::acosh" },
  { path = "f64::atanh", reason = "rounds differently by platform, so use libm::atanh" },
  { path = "f64::cbrt", reason = "rounds differently by platform, so use libm::cbrt" },
  { path = "f64::hypot", reason = "rounds differently by platform, so use libm::hypot" },
  { path = "f64::powi", reason = "its multiplication order is unspecified, so write the product out, or use libm::pow" },
  { path = "f32::exp", reason = "rounds differently by platform, so use libm::expf" },
  { path = "f32::exp2", reason = "rounds differently by platform, so use libm::exp2f" },
  { path = "f32::exp_m1", reason = "rounds differently by platform, so use libm::expm1f" },
  { path = "f32::ln", reason = "rounds differently by platform, so use libm::logf" },
  { path = "f32::log", reason = "rounds differently by platform, so use libm::logf(x) / libm::logf(base)" },
  { path = "f32::log2", reason = "rounds differently by platform, so use libm::log2f" },
  { path = "f32::log10", reason = "rounds differently by platform, so use libm::log10f" },
  { path = "f32::ln_1p", reason = "rounds differently by platform, so use libm::log1pf" },
  { path = "f32::powf", reason = "rounds differently by platform, so use libm::powf, or libm::exp2f for a power of 2" },
  { path = "f32::sin", reason = "rounds differently by platform, so use libm::sinf" },
  { path = "f32::cos", reason = "rounds differently by platform, so use libm::cosf" },
  { path = "f32::tan", reason = "rounds differently by platform, so use libm::tanf" },
  { path = "f32::sin_cos", reason = "rounds differently by platform, so use libm::sincosf" },
  { path = "f32::tanh", reason = "rounds differently by platform, so use libm::tanhf" },
  { path = "f32::sinh", reason = "rounds differently by platform, so use libm::sinhf" },
  { path = "f32::cosh", reason = "rounds differently by platform, so use libm::coshf" },
  { path = "f32::asin", reason = "rounds differently by platform, so use libm::asinf" },
  { path = "f32::acos", reason = "rounds differently by platform, so use libm::acosf" },
  { path = "f32::atan", reason = "rounds differently by platform, so use libm::atanf" },
  { path = "f32::atan2", reason = "rounds differently by platform, so use libm::atan2f" },
  { path = "f32::asinh", reason = "rounds differently by platform, so use libm::asinhf" },
  { path = "f32::acosh", reason = "rounds differently by platform, so use libm::acoshf" },
  { path = "f32::atanh", reason = "rounds differently by platform, so use libm::atanhf" },
  { path = "f32::cbrt", reason = "rounds differently by platform, so use libm::cbrtf" },
  { path = "f32::hypot", reason = "rounds differently by platform, so use libm::hypotf" },
