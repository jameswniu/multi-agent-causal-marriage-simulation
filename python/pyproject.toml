[project]
name = "loveworld"
version = "0.1.0"
description = "Experiment orchestration, causal analysis and dashboard API for the LoveWorld simulation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
loveworld = "loveworld.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loveworld"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"loveworld/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
