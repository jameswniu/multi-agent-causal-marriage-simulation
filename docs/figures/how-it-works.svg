<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1356" width="100%" role="img" aria-label="How a run flows. Experiment file to dashboard, every step logged.">
<clipPath id="frame"><rect width="1200" height="1356" rx="14"/></clipPath>
<g clip-path="url(#frame)">
<rect width="1200" height="1356" fill="#0e1119"/>
</g>
<rect x="0.75" y="0.75" width="1198.5" height="1354.5" rx="14" fill="none" stroke="#2b3242" stroke-width="1.5"/>

<text x="48" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" fill="#eef0f4" font-weight="700" text-anchor="start">How a run flows</text>
<text x="48" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#9aa1ae" text-anchor="start">Experiment file to dashboard, every step logged</text>
<rect x="772" y="36" width="380" height="76" rx="10" fill="#161a24" stroke="#2b3242" stroke-width="1.5"/>
<text x="962" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#eef0f4" font-weight="700" text-anchor="middle">1,000 couples, 365 days</text>
<text x="962" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#9aa1ae" text-anchor="middle">one second in the engine</text>
<text x="48" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#d4627c" font-weight="700" text-anchor="start" letter-spacing="1.5">01  THE EXPERIMENT FILE</text>
<text x="488" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#9aa1ae" text-anchor="start">One YAML file is the whole experiment</text>
<line x1="48" y1="172" x2="1152" y2="172" stroke="#2b3242" stroke-width="1"/>
<rect x="48" y="180" width="1104" height="196" rx="10" fill="#161a24" stroke="#2b3242" stroke-width="1.5"/>
<text x="72" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#eef0f4" font-weight="700" text-anchor="start">experiments/example.yaml</text>
<text x="72" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Couples, days, three seeds, the treatment memory half-life, and any shocks.</text>
<text x="72" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Python turns it into the engine's config JSON and keeps both.</text>
<text x="72" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#9aa1ae" text-anchor="start">loveworld run experiments/example.yaml</text>
<text x="48" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#d4627c" font-weight="700" text-anchor="start" letter-spacing="1.5">02  THE ENGINE</text>
<text x="488" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#9aa1ae" text-anchor="start">Rust on Bevy ECS, headless, deterministic</text>
<line x1="48" y1="448" x2="1152" y2="448" stroke="#2b3242" stroke-width="1"/>
<rect x="48" y="456" width="540" height="226" rx="10" fill="#161a24" stroke="#2b3242" stroke-width="1.5"/>
<text x="72" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#eef0f4" font-weight="700" text-anchor="start">One schedule, every day</text>
<text x="72" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Stress, affect, conflict decision,</text>
<text x="72" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">trust, memory decay, market, log.</text>
<text x="72" y="614" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Every draw keyed by seed and id.</text>
<text x="72" y="658" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#9aa1ae" text-anchor="start">loveworld-engine run --config</text>
<rect x="612" y="456" width="540" height="226" rx="10" fill="#161a24" stroke="#2b3242" stroke-width="1.5"/>
<text x="636" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#eef0f4" font-weight="700" text-anchor="start">What it writes</text>
<text x="636" y="542" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Eight Parquet tables, one manifest</text>
<text x="636" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">with a SHA-256 per table.</text>
<text x="636" y="614" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Replay fails on any mismatch.</text>
<text x="636" y="658" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#9aa1ae" text-anchor="start">loveworld-engine replay --manifest</text>
<text x="48" y="742" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#d4627c" font-weight="700" text-anchor="start" letter-spacing="1.5">03  THE ANALYSIS</text>
<text x="488" y="742" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#9aa1ae" text-anchor="start">Python reads the tables and writes summary.json</text>
<line x1="48" y1="754" x2="1152" y2="754" stroke="#2b3242" stroke-width="1"/>
<rect x="48" y="762" width="540" height="226" rx="10" fill="#161a24" stroke="#2b3242" stroke-width="1.5"/>
<text x="72" y="806" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#eef0f4" font-weight="700" text-anchor="start">Effects with intervals</text>
<text x="72" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Effect per outcome, with bootstrap</text>
<text x="72" y="884" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">intervals and permutation p-values.</text>
<text x="72" y="920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Conditional outcomes are flagged.</text>
<text x="72" y="964" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#9aa1ae" text-anchor="start">loveworld analyze results/example</text>
<rect x="612" y="762" width="540" height="226" rx="10" fill="#161a24" stroke="#2b3242" stroke-width="1.5"/>
<text x="636" y="806" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#eef0f4" font-weight="700" text-anchor="start">Two checks on every experiment</text>
<text x="636" y="848" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Placebo: equal parameters, both</text>
<text x="636" y="884" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">arms must match byte for byte.</text>
<text x="636" y="920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Twins: each couple under both arms.</text>
<text x="636" y="964" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#9aa1ae" text-anchor="start">make placebo &amp;&amp; make twins</text>
<text x="48" y="1048" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#d4627c" font-weight="700" text-anchor="start" letter-spacing="1.5">04  THE DASHBOARD</text>
<text x="488" y="1048" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#9aa1ae" text-anchor="start">FastAPI serves the results, React shows them</text>
<line x1="48" y1="1060" x2="1152" y2="1060" stroke="#2b3242" stroke-width="1"/>
<rect x="48" y="1068" width="1104" height="196" rx="10" fill="#161a24" stroke="#2b3242" stroke-width="1.5"/>
<text x="72" y="1112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#eef0f4" font-weight="700" text-anchor="start">World replay and the causal readout</text>
<text x="72" y="1154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Play the year day by day, open any couple or agent, read every decision.</text>
<text x="72" y="1190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#c9cdd6" text-anchor="start">Pick a shock and run a new experiment from the page in about ten seconds.</text>
<text x="72" y="1240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#9aa1ae" text-anchor="start">make dashboard</text>
<text x="600" y="1332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#9aa1ae" text-anchor="middle">The policy never reads the arm. A test greps four modules for the word.</text>
</svg>
