# Fly.io settings for the public LoveWorld dashboard (docs/deploy.md). Creating the app, the volume and
# the secrets is a manual step James takes; this file only describes the machine once they exist.
app = "multi-agent-causal-marriage-simulation"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LOVEWORLD_PUBLIC = "1"
  LOVEWORLD_RESULTS = "/data/results"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# One dedicated CPU and 4 GB: an engine run needs about half a gigabyte and the API keeps two worlds loaded.
[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "4gb"

[mounts]
  source = "loveworld_data"
  destination = "/data"
