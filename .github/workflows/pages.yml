name: pages
# The free, read-only demo on GitHub Pages. This runner simulates the example town and the shocks frozen in
# experiments/demo/, exports every response the read-only pages read as gzipped files, builds the dashboard
# in static mode and publishes the folder. Nothing here calls a model or needs a key: each demo shock is the
# spec its translation recorded, read from its file. docs/static-demo.md says what is frozen and how to build it.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: astral-sh/setup-uv@v5
      - run: cd python && uv sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: Run the placebo, the twins, the example and the demo shocks
        run: |
          cd python
          uv run loveworld placebo "$GITHUB_WORKSPACE/experiments/example.yaml" --overwrite
          uv run loveworld twins "$GITHUB_WORKSPACE/experiments/example.yaml" --overwrite
          uv run loveworld run "$GITHUB_WORKSPACE/experiments/example.yaml" --out "$GITHUB_WORKSPACE/results/example" --overwrite
          uv run loveworld demo "$GITHUB_WORKSPACE/results"
      - name: Export what every page reads, gzipped
        run: cd python && uv run loveworld static "$GITHUB_WORKSPACE/results" --site "$GITHUB_WORKSPACE/site"
      - name: Build the dashboard in static mode under the site's path, with a page per route and 404.html for deep links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: make static-frontend PAGES_BASE="${BASE_PATH%/}/"
      - name: Check the site
        run: |
          for f in site/index.html site/404.html site/world.html site/data/index.json.gz; do
            test -f "$f" || { echo "The site has no $f"; exit 1; }
          done
          du -sh site
          size=$(du -sk site | cut -f1)
          if [ "$size" -gt 900000 ]; then echo "The site is over 900 MB"; exit 1; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
