name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: target/release/loveworld-engine
  python:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: target/release
      - run: chmod +x target/release/loveworld-engine
      - uses: astral-sh/setup-uv@v5
      - run: cd python && uv sync
      - run: cd python && uv run ruff check . && uv run mypy loveworld
      - run: cd python && uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint && npm test -- --run && npm run build
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/figures.py --check
  claims:
    # The README's badges and figures quote the example run. Rerun it from scratch on this runner,
    # with its placebo and twins first so its summary links them, replay it, and fail if any badge
    # or figure no longer matches what the fresh run says.
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: target/release
      - run: chmod +x target/release/loveworld-engine
      - uses: astral-sh/setup-uv@v5
      - run: cd python && uv sync
      - name: Rerun the placebo, the twins, the example and its replay
        run: |
          cd python
          uv run loveworld placebo "$GITHUB_WORKSPACE/experiments/example.yaml" --overwrite
          uv run loveworld twins "$GITHUB_WORKSPACE/experiments/example.yaml" --overwrite
          uv run loveworld run "$GITHUB_WORKSPACE/experiments/example.yaml" --out "$GITHUB_WORKSPACE/results/example" --overwrite
          uv run loveworld replay "$GITHUB_WORKSPACE/results/example"
      - name: Check every badge and figure against the fresh run
        run: python3 tools/figures.py --check
