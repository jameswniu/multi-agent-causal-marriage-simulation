# The LoveWorld engine: a headless Bevy ECS world of married agent couples that writes Parquet tables and a
# manifest for the Python layer. Its version comes from the workspace (Cargo.toml at the repository root).
[package]
name = "loveworld-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless Bevy ECS simulation engine for LoveWorld: married agent couples, episodic memory, explicit decision policy, Parquet event logs."

[[bin]]
name = "loveworld-engine"
path = "src/main.rs"

[lib]
name = "loveworld_engine"
path = "src/lib.rs"

[dependencies]
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
# The determinism hash is taken over the Parquet files' own bytes, so the writer is as much an input to it as
# the maths below. A new arrow or parquet release may lay out pages, dictionaries or statistics differently and
# move every hash while no number changes, so both are pinned exactly: change them only with an engine version
# bump and a regenerated example, the same rule libm follows.
arrow = { version = "=60.0.0", default-features = false }
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap"] }
sha2 = "0.11"
anyhow = "1.0"
thiserror = "2.0"
# Every exp, log, power and cosine the engine computes goes through libm, a pure software maths library, never
# the platform's own, so one config writes the same bytes on macOS and Linux, on Arm and on x86. The platform
# libraries round some results differently in the last bit. force-soft-floats turns off libm's few hardware
# routines (sqrt, fma and rint, which IEEE 754 requires to be correctly rounded anyway), and clippy.toml at the
# repository root refuses the standard float methods that would bring the platform library back. The version is
# pinned exactly, because a new libm may round differently: change it only with an engine version bump and a
# regenerated example.
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }

[dev-dependencies]
tempfile = "3"
