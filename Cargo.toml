# The LoveWorld Cargo workspace, one crate: the simulation engine in engine/. The workspace version is the
# engine version every run's manifest records, and docs/contracts.md (section 1) says when it must change.
[workspace]
members = ["engine"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 4
